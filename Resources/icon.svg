<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2637"/>
      <stop offset="1" stop-color="#0d1320"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="1" x2="0.5" y2="0">
      <stop offset="0" stop-color="#ff5a2c"/>
      <stop offset="0.5" stop-color="#ff8f3c"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6aa9e0"/>
      <stop offset="1" stop-color="#3d5a80"/>
    </linearGradient>
  </defs>

  <rect x="10" y="10" width="236" height="236" rx="58" fill="url(#bg)"/>
  <rect x="10.75" y="10.75" width="234.5" height="234.5" rx="57.25" fill="none" stroke="#31435f" stroke-width="1.5"/>

  <!-- 眼睛轮廓（gaze） -->
  <path d="M34 128 C 76 74, 180 74, 222 128 C 180 182, 76 182, 34 128 Z"
        fill="#0a0f18" stroke="url(#ring)" stroke-width="7" stroke-linejoin="round"/>

  <!-- 火苗瞳孔（fire） -->
  <path d="M128 82
           c 16 20 26 34 26 48
           a 26 26 0 1 1 -52 0
           c 0 -14 10 -28 26 -48 z"
        fill="url(#flame)"/>
  <path d="M128 112
           c 7 9 11 15 11 21
           a 11 11 0 1 1 -22 0
           c 0 -6 4 -12 11 -21 z"
        fill="#fff3d6" opacity="0.75"/>
</svg>
