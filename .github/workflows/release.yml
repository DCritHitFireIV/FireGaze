name: release (manual promotion policy)

# Replacement draft for .github/workflows/release.yml.
# Tag pushes intentionally have no release workflow trigger.
on:
  workflow_dispatch:

# This workflow builds nothing, downloads nothing, and publishes nothing.
permissions: {}

jobs:
  manual-promotion-instructions:
    name: Show manual release promotion policy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Explain release promotion
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Release promotion is manual

          This workflow does not build or publish a release.

          Ordinary CI builds belong in a separate read-only build workflow.
          CI outputs are not the accepted release assets.

          Promote the reviewed, already accepted ZIP without rebuilding it.
          Bind the release tag, source commit, source file manifest, and ZIP SHA-256.
          Upload the accepted ZIP and the reviewed source manifest to a draft release.
          Publication requires a separate explicit decision after reviewing that draft.
          SUMMARY
