name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud (API 15)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "$env:APPDATA\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/api15/latest.zip" -OutFile "$env:TEMP\dalamud.zip"
          Expand-Archive -Path "$env:TEMP\dalamud.zip" -DestinationPath $dest -Force

      - name: Build
        shell: pwsh
        run: dotnet build src/FireGaze/FireGaze.csproj -c Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FireGaze
          path: src/FireGaze/bin/Release/FireGaze/latest.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src/FireGaze/bin/Release/FireGaze/latest.zip
          generate_release_notes: true
