name: inbox

# 玩家在游戏里点「一键提交」→ 插件打开填好的新建 issue 页 → 玩家按 Submit。
# 这个工作流接手：把投稿落进仓库 → 在 issue 上回一句「收到了」 → 用 secret 里的地址通知维护者。
#
# 为什么不让插件直接推手机：那需要把推送密钥内嵌进发给所有玩家的插件（独立审查 P0-2）。
# 密钥现在只在仓库 secret `SERVER3_PUSH_URL` 里；没配就跳过通知（其余步骤照跑）。

on:
  issues:
    types: [opened, edited]
  # 中继直传的界面文字投稿（/uit-submit 提交的文件）——2026-10-04 新增：
  # 几千条的投稿不再走 issue 粘贴，提交后由本工作流自动并入 uit-packs/。
  push:
    branches: [main]
    paths:
      - 'docs/contributions/inbox/uit-direct-*.json'

permissions:
  contents: write
  issues: write

jobs:
  inbox:
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 把投稿收进仓库
        id: inbox
        env:
          # 用环境变量传正文：把 issue 正文直接插进 shell 命令等于给注入开门（工作流有 contents:write）
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue-body.md"
          python scripts/inbox_contribution.py \
            --issue "${{ github.event.issue.number }}" \
            --body "$RUNNER_TEMP/issue-body.md" \
            --author "${{ github.event.issue.user.login }}" \
            --summary-out "$RUNNER_TEMP/summary.txt" \
            --comment-out "$RUNNER_TEMP/comment.md" \
            --notify-out "$RUNNER_TEMP/notify.md" | tee "$RUNNER_TEMP/inbox.log"

      - name: 把界面文字投稿收进 uit-packs
        # 插件「插件汉化 → 更多 → 提交人工译文到公共库…」发的投稿：并进 uit-packs/<内部名>.json
        if: contains(github.event.issue.body, 'uit-contribution')
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > "$RUNNER_TEMP/issue-body.md"
          python scripts/inbox_uit.py \
            --issue "${{ github.event.issue.number }}" \
            --body "$RUNNER_TEMP/issue-body.md" \
            --author "${{ github.event.issue.user.login }}" \
            --comment-out "$RUNNER_TEMP/comment.md" \
            --summary-out "$RUNNER_TEMP/summary.txt" | tee "$RUNNER_TEMP/inbox-uit.log"

      - name: 提交存档
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 收件箱目录可能不存在（测试数据清理后再没有任何投稿落过盘；feedback/普通 issue 也会触发本工作流）——
          # 直接 git add 一个不存在的路径会 fatal: pathspec did not match，把整条工作流卡死在存档一步。
          if [ -d docs/contributions/inbox ]; then
            git add docs/contributions/inbox
          fi
          git add uit-packs
          if git diff --quiet --cached; then
            echo "存档没有变化（同一条 issue 又编辑了？）"
          else
            git commit -m "chore: 收下 issue #${{ github.event.issue.number }} 的译文投稿"
            git push
          fi

      - name: 回话给提交者
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.RUNNER_TEMP + '/comment.md';
            if (!fs.existsSync(path)) {
              console.log('没有 comment.md（收稿脚本没给回复内容），跳过');
              return;
            }
            const body = fs.readFileSync(path, 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: 通知维护者（配了 secret 才发）
        env:
          PUSH_URL: ${{ secrets.SERVER3_PUSH_URL }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -z "$PUSH_URL" ]; then
            echo "没有配置 SERVER3_PUSH_URL，跳过手机通知（仓库里已经存下这次投稿）"
            exit 0
          fi
          TITLE="FireGaze 译文投稿 $(cat "$RUNNER_TEMP/summary.txt")"
          if [ -f "$RUNNER_TEMP/notify.md" ]; then
            DETAILS="$(cat "$RUNNER_TEMP/notify.md")"
          else
            DETAILS="$(cat "$RUNNER_TEMP/summary.txt")"
          fi
          case "$ISSUE_BODY" in
            *uit-contribution*)
              HOWTO="界面文字投稿已自动并入 uit-packs/，无需手动收录；抽查后随每周库更新对玩家生效"
              ;;
            *)
              HOWTO="审核后用 python scripts/import_contributions.py docs/contributions/inbox/<存档>.json --push 收录"
              ;;
          esac
          BODY="$DETAILS

          https://github.com/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}
          $HOWTO"
          curl -sS -X POST "$PUSH_URL" \
            --data-urlencode "title=$TITLE" \
            --data-urlencode "desp=$BODY" || echo "通知发送失败（不影响收录）"

  direct:
    # 中继直传的界面文字投稿：校验 + 并入 uit-packs + 留档 + 通知。
    # 没有 issue 可回——投稿者在插件里直接拿到云端文件/提交链接。
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 并入直传投稿
        run: |
          python scripts/ingest_uit_direct.py --summary-out "$RUNNER_TEMP/summary.txt"

      - name: 提交存档与译文包
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/contributions/inbox uit-packs
          if git diff --quiet --cached; then
            echo "没有变化（这一批直传已经并入过）"
            exit 0
          fi
          git commit -m "chore: 并入玩家直传的界面文字投稿"
          git push || { git pull --rebase && git push; }

      - name: 通知维护者（配了 secret 才发）
        env:
          PUSH_URL: ${{ secrets.SERVER3_PUSH_URL }}
        run: |
          if [ -z "$PUSH_URL" ]; then
            echo "没有配置 SERVER3_PUSH_URL，跳过手机通知（仓库里已经存下这次投稿）"
            exit 0
          fi
          if [ ! -s "$RUNNER_TEMP/summary.txt" ]; then
            echo "这次没有新并入的投稿，不通知"
            exit 0
          fi
          TITLE="FireGaze 直传投稿 $(head -1 "$RUNNER_TEMP/summary.txt" | cut -c1-60)"
          BODY="$(cat "$RUNNER_TEMP/summary.txt")

          界面文字投稿已自动并入 uit-packs/，无需手动收录；抽查后随下次库更新对玩家生效
          https://github.com/${GITHUB_REPOSITORY}/commits/main"
          curl -sS -X POST "$PUSH_URL" \
            --data-urlencode "title=$TITLE" \
            --data-urlencode "desp=$BODY" || echo "通知发送失败（不影响收录）"
