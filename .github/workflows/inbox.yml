name: inbox

# Each event has its own transaction. Never cancel pending contribution events.
# A push collision refetches main and reruns ingestion, including index generation.
# Periodic/manual recovery handles an interrupted event or an App's missed push event.
on:
  issues:
    types: [opened, edited]
  push:
    branches: [main]
    paths:
      - 'docs/contributions/inbox/uit-direct-*.json'
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Recovery lookback in days'
        type: number
        default: 7
      max_pages:
        description: 'Maximum Issues API pages (100 issues per page)'
        type: number
        default: 5

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, '[译文贡献]') || startsWith(github.event.issue.title, '翻译贡献 ')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Persist contributions with bounded rebuild retries
        id: ingest
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'issues' && 'issue' || github.event_name == 'push' && 'direct' || 'recover' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || 7 }}
          MAX_PAGES: ${{ inputs.max_pages || 5 }}
        run: |
          python scripts/process_inbox_job.py \
            --repo "$GITHUB_WORKSPACE" \
            --mode "$MODE" \
            --event "$GITHUB_EVENT_PATH" \
            --output-dir "$RUNNER_TEMP/inbox-persisted" \
            --lookback-days "$LOOKBACK_DAYS" \
            --max-pages "$MAX_PAGES"

      # Recovery transactions are independent: earlier successes still receive
      # their replies even if a later issue fails. Failed attempts publish nothing.
      - name: Reply only for persisted new contributions
        if: always() && steps.ingest.outcome != 'skipped'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const directory = path.join(process.env.RUNNER_TEMP, 'inbox-persisted', 'issues');
            if (!fs.existsSync(directory)) return;
            let failed = false;
            for (const filename of fs.readdirSync(directory).filter(name => name.endsWith('.json'))) {
              const item = JSON.parse(fs.readFileSync(path.join(directory, filename), 'utf8'));
              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: item.issue_number,
                  body: item.comment,
                });
              } catch (error) {
                failed = true;
                core.error(`Could not reply to persisted issue #${item.issue_number}: ${error.message}`);
              }
            }
            if (failed) core.setFailed('Some persisted contributions could not receive their reply');

      - name: Publish persisted review samples
        if: always() && steps.ingest.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -d "$RUNNER_TEMP/inbox-persisted/reviews" ]; then
            python scripts/post_review_issues.py --reviews-dir "$RUNNER_TEMP/inbox-persisted/reviews"
          fi

      - name: Notify maintainer for persisted new contributions
        if: always() && steps.ingest.outcome != 'skipped'
        env:
          PUSH_URL: ${{ secrets.SERVER3_PUSH_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.parse
          import urllib.request

          url = os.environ.get('PUSH_URL')
          if not url:
              print('No notification endpoint configured; contributions are already persisted.')
              raise SystemExit(0)
          root = Path(os.environ['RUNNER_TEMP']) / 'inbox-persisted'
          messages = []
          for path in sorted((root / 'issues').glob('*.json')):
              item = json.loads(path.read_text(encoding='utf-8'))
              if item.get('summary'):
                  link = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/issues/{item['issue_number']}"
                  messages.append(('FireGaze 译文投稿 ' + item['summary'][:100],
                                   (item.get('notify') or item['summary']) + '\n\n' + link))
          direct_summary = root / 'summary.txt'
          if direct_summary.exists():
              summary = direct_summary.read_text(encoding='utf-8')
              messages.append(('FireGaze 直传投稿 ' + summary.splitlines()[0][:60], summary))
          for title, body in messages:
              encoded = urllib.parse.urlencode({'title': title, 'desp': body}).encode('utf-8')
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, data=encoded), timeout=30) as response:
                      response.read()
              except OSError:
                  print('Notification failed; the contribution remains persisted.')
          PY

      - name: Preserve persisted outbox for inspection
        if: always() && steps.ingest.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: inbox-persisted-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/inbox-persisted
          if-no-files-found: ignore
          retention-days: 7
