name: update-download-count

on:
  schedule:
    # Twice an hour, away from the busy top of the hour. GitHub may queue runs.
    - cron: '17,47 * * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-count
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Release events point at a tag; statistics must update the main branch.
          ref: ${{ github.event.repository.default_branch }}

      - name: Update download statistics and README badge
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 scripts/update_download_count.py \
            --repo "$GITHUB_WORKSPACE" \
            --branch "$DEFAULT_BRANCH"
